<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dreamy Emoji Slicer</title>
    <!-- SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Иконки -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --primary-color: var(--tg-theme-button-color, #248bed);
            --primary-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #242424);
            --radius-main: 16px;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-label {
            width: 100%;
            max-width: 320px;
            padding: 40px 20px;
            background: var(--secondary-bg-color);
            border: 2px dashed var(--hint-color);
            border-radius: var(--radius-main);
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #preview-card {
            display: none;
            width: 100%;
            max-width: 320px;
            margin-top: 20px;
        }

        #preview-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
        }

        #preview-img { width: 100%; display: block; }

        .grid-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; pointer-events: none;
        }

        .grid-cell { border: 1px solid rgba(255,255,255,0.3); box-shadow: inset 0 0 5px rgba(0,0,0,0.2); }

        .controls {
            display: none;
            margin-top: 20px;
            background: var(--secondary-bg-color);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
        }

        .input-group { display: flex; justify-content: space-between; align-items: center; }
        input { 
            width: 60px; padding: 8px; border-radius: 8px; border: none; 
            background: var(--bg-color); color: var(--text-color); text-align: center;
        }
    </style>
</head>
<body>

    <h3>✨ Dreamy Emoji</h3>

    <input type="file" id="upload" accept="image/*" style="display:none">
    <label for="upload" class="upload-label" id="label">
        <i class='bx bx-cloud-upload' style="font-size: 40px"></i>
        <span id="labelText">Выбрать фотографию</span>
    </label>

    <div class="controls" id="controls">
        <div class="input-group">
            <span>Ширина: <input type="number" id="wInp" value="3" min="1" max="10"></span>
            <span>Высота: <input type="number" id="hInp" value="3" min="1" max="10"></span>
        </div>
    </div>

    <div id="preview-card">
        <div id="preview-container">
            <img id="preview-img">
            <div id="grid" class="grid-overlay"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const upload = document.getElementById('upload');
        const img = document.getElementById('preview-img');
        const grid = document.getElementById('grid');
        const wInp = document.getElementById('wInp');
        const hInp = document.getElementById('hInp');

        function drawGrid() {
            grid.style.gridTemplateColumns = `repeat(${wInp.value}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${hInp.value}, 1fr)`;
            grid.innerHTML = '';
            for (let i = 0; i < wInp.value * hInp.value; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                grid.appendChild(cell);
            }
        }

        upload.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                img.src = ev.target.result;
                document.getElementById('controls').style.display = 'block';
                document.getElementById('preview-card').style.display = 'block';
                document.getElementById('labelText').innerText = "Фото выбрано";
                drawGrid();
                
                tg.MainButton.setText("✨ СОЗДАТЬ ПАК");
                tg.MainButton.show();
            };
            reader.readAsDataURL(file);
        };

        [wInp, hInp].forEach(i => i.oninput = drawGrid);

        tg.onEvent('mainButtonClicked', () => {
            const data = { w: wInp.value, h: hInp.value };
            tg.sendData(JSON.stringify(data)); 
        });
    </script>
</body>
</html>
